name: ROS 2 Humble

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  humble-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify runner selection logic
        run: bash tools/test_run_humble.sh
      - name: Verify pinned Jammy Humble environment
        env:
          HUMBLE_TIMEOUT_SECONDS: 900
        run: |
          mkdir -p ros2_ws/src
          ./tools/run_humble.sh bash -lc 'test "$(. /etc/os-release; echo $VERSION_ID)" = 22.04 && source /opt/ros/humble/setup.bash && test "$ROS_DISTRO" = humble && python3 --version'
          ./tools/run_humble.sh bash -lc 'source /opt/ros/humble/setup.bash && colcon list --base-paths ros2_ws/src && ros2 doctor --report'
      - name: Build and test workspace when packages are present
        env:
          HUMBLE_TIMEOUT_SECONDS: 900
        run: |
          ./tools/run_humble.sh bash -lc 'source /opt/ros/humble/setup.bash && if colcon list --base-paths ros2_ws/src | grep -q .; then rosdep install --from-paths ros2_ws/src --ignore-src -r -y && colcon build --symlink-install && colcon test --event-handlers console_direct+ && colcon test-result --all --verbose; else echo "No ROS packages are present yet; build/test deferred."; fi'
