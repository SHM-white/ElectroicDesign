# Gazebo Fortress uses ignition.msgs names; these are the Humble bridge types.
# /clock is bridged exactly once and is never produced by a ROS node.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /camera/narrow/image_raw
  gz_topic_name: /camera/narrow/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/narrow/camera_info
  gz_topic_name: /camera/narrow/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /camera/wide/image_raw
  gz_topic_name: /camera/wide/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/wide/camera_info
  gz_topic_name: /camera/wide/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /lidar/points
  gz_topic_name: /lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /lidar/imu
  gz_topic_name: /lidar/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /rangefinder/range
  gz_topic_name: /rangefinder/range
  ros_type_name: sensor_msgs/msg/Range
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /simulation/ground_truth/odom
  gz_topic_name: /simulation/ground_truth/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /simulation/cmd_vel
  gz_topic_name: /ed_quadrotor/simulation/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /simulation/enable
  gz_topic_name: /ed_quadrotor/simulation/enable
  ros_type_name: std_msgs/msg/Bool
  gz_type_name: ignition.msgs.Boolean
  direction: ROS_TO_GZ
