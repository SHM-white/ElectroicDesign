# D题场地 2026-08 实测配置（4m × 5m 作业区）。
# 参照赛题《陆空协同无人机系统（D题）》: 400cm×500cm 场地, 安全网顶部不低于 250cm。
# 坐标约定: 原点为场地左下角，X 沿 4m 短边向右，Y 沿 5m 长边向上，ENU。
version: 1
profile_type: field
profile_id: d-arena-2026
units:
  length: m
  angle: rad
frame:
  id: map
  convention: ENU
provenance:
  classification: current_field
  activation: eligible
takeoff:
  origin:
    # H 外圈直径 0.75m；圆心距左、下场边均为 1.125m。
    x_m: 1.125
    y_m: 1.125
  commanded_heading_rad: 1.5707963267948966
colors:
  - id: arena-boundary
    label: arena boundary
boundary_segments:
  - id: south
    start: {x_m: 0.0, y_m: 0.0}
    end: {x_m: 4.0, y_m: 0.0}
    color_id: arena-boundary
  - id: east
    start: {x_m: 4.0, y_m: 0.0}
    end: {x_m: 4.0, y_m: 5.0}
    color_id: arena-boundary
  - id: north
    start: {x_m: 4.0, y_m: 5.0}
    end: {x_m: 0.0, y_m: 5.0}
    color_id: arena-boundary
  - id: west
    start: {x_m: 0.0, y_m: 5.0}
    end: {x_m: 0.0, y_m: 0.0}
    color_id: arena-boundary
allowed_zone:
  id: d-arena
  vertices:
    - {x_m: 0.0, y_m: 0.0}
    - {x_m: 4.0, y_m: 0.0}
    - {x_m: 4.0, y_m: 5.0}
    - {x_m: 0.0, y_m: 5.0}
no_fly_zones: []
altitude:
  minimum_m: 0.5
  maximum_m: 2.5
  takeoff_m: 1.5
landmarks:
  - id: home-h
    kind: landing-zone
    position: {x_m: 1.125, y_m: 1.125}
  - id: route-a
    kind: route-event
    position: {x_m: 1.5, y_m: 2.0}
  - id: route-b
    kind: route-event
    position: {x_m: 1.5, y_m: 3.5}
  - id: route-c
    kind: route-waypoint
    position: {x_m: 3.0, y_m: 3.5}
  - id: route-d
    kind: route-event
    position: {x_m: 3.0, y_m: 2.0}
