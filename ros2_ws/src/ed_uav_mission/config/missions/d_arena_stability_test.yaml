  circle_segment_m: 0.5
  # 航向保持误差容限，当前仅做占位，后续接入闭环时可用于判定
  heading_hold_tolerance_rad: 0.05
terminal_landing:
  land_altitude_m: 0.0
  descent_speed_m_s: 0.5
  disarm_after_sec: 1.0
